timeout: 5
serial: yes
graphics: yes
default_entry: 1
quiet: no

/ZealOS Pi 4B desktop - PI-DESKTOP-2
    protocol: limine
    path: boot():/boot/zealbooter.elf
    cmdline: zeal.plat=pi4
    dtb_path: boot():/bcm2711-rpi-4-b.dtb
    module_path: boot():/boot/kernel.elf
    module_path: boot():/boot/demo.hcbc
    module_path: boot():/boot/sources.tar
    kaslr: no
    resolution: 800x600x32

/ZealOS Pi 4B USB diagnostic recovery - MULTI-USB2-6
    protocol: limine
    path: boot():/boot/zealbooter.elf
    cmdline: zeal.plat=pi4
    dtb_path: boot():/bcm2711-rpi-4-b.dtb
    module_path: boot():/boot/kernel-diag.elf
    module_path: boot():/boot/demo.hcbc
    kaslr: no
    resolution: 800x600x32
